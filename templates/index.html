<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratolog - Catalog your gear!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(to right, #f7f7f7, #dfe9f3);
        }

        h1 {
            font-family: 'Poppins', sans-serif;
            font-weight: bold;
        }

        .guitar-card {
            transition: all 0.3s ease-in-out;
        }

        .guitar-card:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .guitar-card h3 {
            color: #007bff;
        }

        .guitar-card .badge {
            font-size: 0.9em;
            padding: 0.4em 0.8em;
        }

        .guitar-card .fa-guitar {
            color: #f39c12;
            font-size: 2rem;
        }

        .add-guitar {
            background-color: #fff;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
        }

        .add-guitar input {
            border: 1px solid #ccc;
            margin-bottom: 15px;
        }

        .btn-add {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            transition: background-color 0.3s;
        }

        .btn-add:hover {
            background-color: #218838;
        }
    </style>
</head>

<body>
    <div class="container my-5">
        <h1 class="text-center text-primary mb-5 display-4">Guitar Collection</h1>
        <div class="add-guitar mx-auto mb-5">
            <h2 class="text-center text-success mb-4">Add a New Guitar</h2>
            <form id="add-guitar-form">
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="new-brand" placeholder="Brand" required>
                    <label for="new-brand">Brand</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="new-model" placeholder="Model" required>
                    <label for="new-model">Model</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="new-year" placeholder="Year" required>
                    <label for="new-year">Year</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="new-colour" placeholder="Colour" required>
                    <label for="new-colour">Colour</label>
                </div>
                <div class="form-floating mb-3">
                    <input type="text" class="form-control" id="new-type" placeholder="Type" required>
                    <label for="new-type">Type</label>
                </div>
                <button type="button" id="add-guitar-button" class="btn btn-add w-100 py-3">
                    <i class="fas fa-plus"></i> Add Guitar
                </button>
            </form>
        </div>
        <div class="row" id="guitar-list">
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        async function fetchGuitars() {
            try {
                const response = await fetch('/guitars');
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const guitars = await response.json();
                displayGuitars(guitars);
            } catch (error) {
                console.error('There has been a problem with your fetch operation:', error);
            }
        }

        function displayGuitars(guitars) {
            const guitarList = document.getElementById('guitar-list');
            guitarList.innerHTML = '';

            guitars.forEach(guitar => {
                const guitarCard = document.createElement('div');
                guitarCard.className = 'guitar-card col-md-4 col-lg-3 mb-4';
                guitarCard.innerHTML = `
                    <div class="card h-100 text-center shadow-sm">
                        <div class="card-body">
                            <i class="fas fa-guitar mb-3"></i>
                            <h3 class="card-title">${guitar.brand} ${guitar.model}</h3>
                            <span class="badge bg-secondary mb-2">${guitar.year}</span>
                            <span class="badge bg-info mb-2">${guitar.colour}</span>
                            <span class="badge bg-warning mb-2">${guitar.type}</span>
                            <p class="card-text">ID: ${guitar.id}</p>
                            <button class="btn btn-primary w-100 mb-2" onclick="viewGuitar(${guitar.id})">
                                Edit
                            </button>
                            <button class="btn btn-danger w-100" onclick="deleteGuitar(${guitar.id})">
                                Delete
                            </button>
                        </div>
                    </div>
                `;
                guitarList.appendChild(guitarCard);
            });
        }

        function viewGuitar(id) {
            window.location.href = `edit?id=${id}`;
        }

        async function deleteGuitar(id) {
            if (confirm('Are you sure you want to delete this guitar?')) {
                try {
                    const response = await fetch(`/guitars/${id}`, {
                        method: 'DELETE',
                    });

                    if (!response.ok) {
                        throw new Error('Failed to delete guitar');
                    }

                    alert('Guitar deleted successfully!');
                    fetchGuitars();
                } catch (error) {
                    console.error('Error deleting guitar:', error);
                    alert('Error deleting guitar: ' + error.message);
                }
            }
        }

        document.getElementById('add-guitar-button').onclick = async function () {
            const newGuitar = {
                brand: document.getElementById('new-brand').value,
                model: document.getElementById('new-model').value,
                year: document.getElementById('new-year').value,
                colour: document.getElementById('new-colour').value,
                type: document.getElementById('new-type').value
            };
            try {
                const response = await fetch('/guitars', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newGuitar)
                });

                if (!response.ok) {
                    throw new Error('Failed to add guitar');
                }

                alert('Guitar added successfully!');
                fetchGuitars();
            } catch (error) {
                console.error('Error adding guitar:', error);
                alert('Error adding guitar: ' + error.message);
            }
        };

        window.onload = fetchGuitars;
    </script>

</body>

</html>
