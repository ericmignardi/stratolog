<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stratolog - Catalog Your Gear!</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <style>
        body {
            background-color: #e9ecef;
        }
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #343a40;
            text-align: center;
            margin-bottom: 2rem;
        }
        .table {
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }
        .table thead th {
            background-color: #4a90e2;
            color: white;
            font-weight: bold;
        }
        .modal-header {
            background-color: #4a90e2;
            color: white;
        }
        .modal-body {
            padding: 2rem;
        }
        .btn-primary {
            background-color: #4a90e2;
            border-color: #4a90e2;
            transition: background-color 0.3s, border-color 0.3s;
        }
        .btn-primary:hover {
            background-color: #357ABD;
            border-color: #357ABD;
        }
        .card {
            border: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
        }
        .btn-action {
            width: 100%;
        }
        .footer {
            text-align: center;
            margin-top: 2rem;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Guitar Collection</h1>
        <button class="btn btn-primary mb-3" data-toggle="modal" data-target="#addGuitarModal">Add New Guitar</button>
        <div class="table-responsive">
            <table class="table table-bordered table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Brand</th>
                        <th>Model</th>
                        <th>Year</th>
                        <th>Colour</th>
                        <th>Type</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="guitarTableBody">
                    
                </tbody>
            </table>
        </div>
        <footer class="footer">
            <p>&copy; 2024 Stratolog. All rights reserved.</p>
        </footer>
    </div>

    <div class="modal fade" id="addGuitarModal" tabindex="-1" role="dialog" aria-labelledby="addGuitarModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="addGuitarModalLabel">Add New Guitar</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="addGuitarForm">
                        <div class="form-group">
                            <label for="brand">Brand</label>
                            <input type="text" class="form-control" id="brand" required>
                        </div>
                        <div class="form-group">
                            <label for="model">Model</label>
                            <input type="text" class="form-control" id="model" required>
                        </div>
                        <div class="form-group">
                            <label for="year">Year</label>
                            <input type="number" class="form-control" id="year" required>
                        </div>
                        <div class="form-group">
                            <label for="colour">Colour</label>
                            <input type="text" class="form-control" id="colour" required>
                        </div>
                        <div class="form-group">
                            <label for="type">Type</label>
                            <input type="text" class="form-control" id="type" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Add Guitar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editGuitarModal" tabindex="-1" role="dialog" aria-labelledby="editGuitarModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="editGuitarModalLabel">Edit Guitar</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <form id="editGuitarForm">
                        <input type="hidden" id="editGuitarId">
                        <div class="form-group">
                            <label for="editBrand">Brand</label>
                            <input type="text" class="form-control" id="editBrand" required>
                        </div>
                        <div class="form-group">
                            <label for="editModel">Model</label>
                            <input type="text" class="form-control" id="editModel" required>
                        </div>
                        <div class="form-group">
                            <label for="editYear">Year</label>
                            <input type="number" class="form-control" id="editYear" required>
                        </div>
                        <div class="form-group">
                            <label for="editColour">Colour</label>
                            <input type="text" class="form-control" id="editColour" required>
                        </div>
                        <div class="form-group">
                            <label for="editType">Type</label>
                            <input type="text" class="form-control" id="editType" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchGuitars() {
            const response = await fetch('/guitars');
            const guitars = await response.json();
            const tableBody = document.getElementById('guitarTableBody');
            tableBody.innerHTML = '';
            guitars.forEach(guitar => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${guitar.id}</td>
                    <td>${guitar.brand}</td>
                    <td>${guitar.model}</td>
                    <td>${guitar.year}</td>
                    <td>${guitar.colour}</td>
                    <td>${guitar.type}</td>
                    <td>
                        <button class="btn btn-warning btn-sm btn-action" onclick="editGuitar(${guitar.id})">Edit</button>
                        <button class="btn btn-danger btn-sm btn-action" onclick="deleteGuitar(${guitar.id})">Delete</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        }

        document.getElementById('addGuitarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const newGuitar = {
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                year: document.getElementById('year').value,
                colour: document.getElementById('colour').value,
                type: document.getElementById('type').value,
            };
            await fetch('/guitars', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newGuitar),
            });
            $('#addGuitarModal').modal('hide');
            fetchGuitars();
        });

        async function editGuitar(id) {
            const response = await fetch(`/guitars/${id}`);
            const guitar = await response.json();
            document.getElementById('editGuitarId').value = guitar.id;
            document.getElementById('editBrand').value = guitar.brand;
            document.getElementById('editModel').value = guitar.model;
            document.getElementById('editYear').value = guitar.year;
            document.getElementById('editColour').value = guitar.colour;
            document.getElementById('editType').value = guitar.type;

            $('#editGuitarModal').modal('show');
        }

        document.getElementById('editGuitarForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editGuitarId').value;
            const updatedGuitar = {
                brand: document.getElementById('editBrand').value,
                model: document.getElementById('editModel').value,
                year: document.getElementById('editYear').value,
                colour: document.getElementById('editColour').value,
                type: document.getElementById('editType').value,
            };
            await fetch(`/guitars/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(updatedGuitar),
            });
            $('#editGuitarModal').modal('hide');
            fetchGuitars();
        });

        async function deleteGuitar(id) {
            await fetch(`/guitars/${id}`, { method: 'DELETE' });
            fetchGuitars();
        }

        fetchGuitars();
    </script>
</body>
</html>
